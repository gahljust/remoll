name: Build develop without trigger scintillators

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout orchestration
        uses: actions/checkout@v4
        with:
          path: orchestration
          persist-credentials: false

      - name: Checkout untouched official source
        uses: actions/checkout@v4
        with:
          # geometry/generators/* are submodules. Without them the GDML
          # generator inputs are missing from the build context and the image
          # would be built from an incomplete geometry tree.
          repository: JeffersonLab/remoll
          ref: 02d4070f3f73b83921d79befd3d5233b750cc2a7
          path: upstream
          submodules: recursive
          persist-credentials: false

      - name: Fetch hash-validated magnetic-field maps
        working-directory: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p map_directory
          gh release download campaign-assets \
            --repo '${{ github.repository }}' \
            --pattern 'V2U.1a.50cm.parallel.txt.gz' \
            --pattern 'DS_TM1-4_CoilA-G_ll_TM2-4_out3mm.txt.gz' \
            --dir map_directory
          gzip -dkf map_directory/V2U.1a.50cm.parallel.txt.gz
          gzip -dkf map_directory/DS_TM1-4_CoilA-G_ll_TM2-4_out3mm.txt.gz
          echo '99bf3fae83677c6c2f3e09a871682b2e  map_directory/V2U.1a.50cm.parallel.txt.gz' | md5sum -c -
          echo 'b8b30b803bae42f69135323ff40fe7db  map_directory/V2U.1a.50cm.parallel.txt' | md5sum -c -
          echo '070b004ffd281ebceee0b6eaaa847edf  map_directory/DS_TM1-4_CoilA-G_ll_TM2-4_out3mm.txt.gz' | md5sum -c -
          echo '9f97ba09601fc26676c1fd6ebd44731d  map_directory/DS_TM1-4_CoilA-G_ll_TM2-4_out3mm.txt' | md5sum -c -

      - name: Stage explicit geometry change
        run: cp orchestration/remove_scintillators.py upstream/remove_scintillators.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag from branch name
        id: tag
        run: |
          # ghcr.io requires a lowercase repository path; branch names may
          # contain "/" which is not valid in a tag.
          owner_repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          branch="$(echo '${{ github.ref_name }}' | tr '/' '-' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner_repo}/remoll-campaign" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      # Keep the compiled dependencies as a build asset, even if the much
      # smaller remoll stage fails. Inline cache lives inside this image;
      # no Actions cache or separate registry-cache blobs are created.
      - name: Build and retain pinned toolchain
        uses: docker/build-push-action@v5
        with:
          context: upstream
          file: orchestration/Dockerfile.vanilla
          target: dependencies
          push: true
          tags: ${{ steps.tag.outputs.image }}:toolchain-g41142-root64002
          cache-from: type=registry,ref=${{ steps.tag.outputs.image }}:toolchain-g41142-root64002
          cache-to: type=inline

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: upstream
          file: orchestration/Dockerfile.vanilla
          push: true
          build-args: |
            REMOLL_REVISION=02d4070f3f73b83921d79befd3d5233b750cc2a7
          cache-from: |
            type=registry,ref=${{ steps.tag.outputs.image }}:toolchain-g41142-root64002
            type=registry,ref=${{ steps.tag.outputs.image }}:develop-noscint-02d4070f3f73
          cache-to: type=inline
          tags: |
            ${{ steps.tag.outputs.image }}:develop-noscint-02d4070f3f73
          # Do not create a GitHub Actions layer cache.  The published GHCR
          # image is the only remote build product retained by this project.

      - name: Report image reference
        run: |
          echo "Pushed:"
          echo "  ${{ steps.tag.outputs.image }}:develop-noscint-02d4070f3f73"
          echo
          echo "Use the branch tag as the 'image' input of the campaign farm workflow."
