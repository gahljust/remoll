# Build THIS branch of remoll into a container image and publish it to the
# GitHub Container Registry, so that campaign farm jobs pull a prebuilt image
# instead of compiling remoll separately in every matrix job.
#
# This is additive: it does not touch the existing docker-image.yml workflow,
# which still builds and pushes jeffersonlab/remoll to Docker Hub.
#
# The campaign needs a build of the LOCAL branch (custom generators, kinematic
# bias messengers, remollInteractionRecorder), so jeffersonlab/remoll:latest is
# not a substitute.
#
# Run it from the Actions tab ("Build campaign image" -> Run workflow), or let
# it fire automatically when source that affects the binary changes.

name: Build campaign image

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'include/**'
      - 'geometry/**'
      - 'macros/**'
      - 'analysis/showermax/**'
      - 'CMakeLists.txt'
      - 'Dockerfile'
      - '.github/workflows/campaign-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with geometry generator submodules)
        uses: actions/checkout@v4
        with:
          # geometry/generators/* are submodules. Without them the GDML
          # generator inputs are missing from the build context and the image
          # would be built from an incomplete geometry tree.
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag from branch name
        id: tag
        run: |
          # ghcr.io requires a lowercase repository path; branch names may
          # contain "/" which is not valid in a tag.
          owner_repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          branch="$(echo '${{ github.ref_name }}' | tr '/' '-' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner_repo}/remoll-campaign" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.branch }}
            ${{ steps.tag.outputs.image }}:${{ github.sha }}
          # Layer cache in the registry keeps rebuilds cheap: only the final
          # remoll compile layer is redone when source changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image reference
        run: |
          echo "Pushed:"
          echo "  ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.branch }}"
          echo "  ${{ steps.tag.outputs.image }}:${{ github.sha }}"
          echo
          echo "Use the branch tag as the 'image' input of the campaign farm workflow."
