# Dumb remoll job farm.
#
# A worker does exactly one thing: run remoll on a macro that was generated
# LOCALLY, then hand the ROOT file back. No campaign framework, no analysis, no
# viewer, no convergence logic, no kinematics table, no campaign repository and
# no token are needed here. Every decision -- what to run, whether the result
# converged, whether to run more -- stays on the local machine.
#
# Two shapes, one workflow. Give exactly one input:
#
#   bundle_b64  N configurations, one job each -- a breadth round. Twenty
#               20k-event macros are ~546 KB raw but ~12.5 KB as a single
#               tar.gz+base64, because they differ in only a handful of
#               generator lines. Built by prepare_farm_bundle.py.
#
#   macro_b64   one configuration, N workers -- a depth round that converges a
#               single cell ~N times faster. Built by prepare_farm_jobs.py.
#
# Each macro carries two placeholders, @@SEED@@ and @@OUTPUT@@, which are the
# only things substituted remotely; that is text replacement, not physics.

name: Campaign farm

on:
  workflow_dispatch:
    inputs:
      bundle_b64:
        description: 'tar.gz+base64 bundle from prepare_farm_bundle.py (N configs, 1 job each)'
        required: false
        default: ''
      macro_b64:
        description: 'gzip+base64 single macro from prepare_farm_jobs.py (1 config, N workers)'
        required: false
        default: ''
      workers:
        description: 'macro_b64 mode only: parallel jobs (GitHub Free allows 20)'
        required: false
        default: '20'
      seed_base:
        description: 'Worker k uses seed_base + k (must match the local manifest)'
        required: true
        default: '710000'
      threads:
        description: 'remoll threads per job (hosted runners have 2 vCPU)'
        required: true
        default: '2'
      image_tag:
        description: 'Tag built by "Build campaign image" (usually the branch name)'
        required: true
        default: 'gahljust-working'
      label:
        description: 'Short tag for the artifacts, e.g. c12_us_6600_c12_elastic'
        required: true
      replay_bank:
        description: 'Optional same-repository release input: tag/filename.root#sha256 (validation only)'
        required: false
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.build.outputs.jobs }}
      mode: ${{ steps.build.outputs.mode }}
      image: ${{ steps.image.outputs.ref }}
    steps:
      - id: build
        env:
          BUNDLE: ${{ github.event.inputs.bundle_b64 }}
          MACRO: ${{ github.event.inputs.macro_b64 }}
          WORKERS: ${{ github.event.inputs.workers }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import base64, io, json, os, re, tarfile
          bundle = (os.environ.get("BUNDLE") or "").strip()
          macro = (os.environ.get("MACRO") or "").strip()
          if bool(bundle) == bool(macro):
              raise SystemExit("give exactly one of bundle_b64 or macro_b64")
          if bundle:
              # Expanded here only to learn the member names and fix their
              # order; each job re-expands the same bundle and takes its own.
              with tarfile.open(fileobj=io.BytesIO(base64.b64decode(bundle)),
                                mode="r:gz") as tar:
                  # Sidecars (notably fixed-quota Neyman plans) travel in the
                  # same archive but do not create matrix jobs.
                  members = tar.getmembers()
                  # Inputs are flat files, not paths or links into the runner.
                  if any(not m.isfile() or m.name.endswith(".root") or not re.fullmatch(r"[A-Za-z0-9_][A-Za-z0-9_.-]*", m.name)
                         for m in members):
                      raise SystemExit("bundle members must be plain input files with simple names; .root output is not allowed")
                  if len({m.name for m in members}) != len(members):
                      raise SystemExit("duplicate bundle member")
                  names = sorted(m.name for m in members if m.name.endswith(".mac"))
              if not 1 <= len(names) <= 20:
                  raise SystemExit(f"bundle holds {len(names)} macros, expected 1..20")
              jobs = [{"index": i, "macro": n,
                       "label": n[:-4] if n.endswith(".mac") else n}
                      for i, n in enumerate(names)]
              print("mode=bundle")
          else:
              n = int(os.environ.get("WORKERS") or "20")
              if not 1 <= n <= 20:
                  raise SystemExit(f"workers must be 1..20, got {n}")
              jobs = [{"index": i, "macro": "", "label": ""} for i in range(n)]
              print("mode=macro")
          print("jobs=" + json.dumps(jobs))
          PY

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Pin the campaign image
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -o pipefail
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "invalid image tag"; exit 1; }
          owner_repo="$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner_repo}/remoll-campaign"
          # Resolve the tag once: later workers and job retries use this same build.
          digest=$(docker buildx imagetools inspect "${image}:${IMAGE_TAG}" --format '{{.Manifest}}' |
            awk '$1 == "Digest:" && !seen {print $2; seen=1}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "could not resolve image digest"; exit 1; }
          echo "ref=${image}@${digest}" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350          # under the 6 h hard cap, with upload headroom
    strategy:
      fail-fast: false            # a worker dying must not cancel the others
      matrix:
        job: ${{ fromJson(needs.plan.outputs.jobs) }}
    steps:
      - name: Checkout the output validator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: .github/scripts/validate_output.C

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize this job's macro
        id: macro
        env:
          BUNDLE: ${{ github.event.inputs.bundle_b64 }}
          MACRO: ${{ github.event.inputs.macro_b64 }}
          MODE: ${{ needs.plan.outputs.mode }}
          MEMBER: ${{ matrix.job.macro }}
          MEMBER_LABEL: ${{ matrix.job.label }}
          INDEX: ${{ matrix.job.index }}
          SEED_BASE: ${{ github.event.inputs.seed_base }}
          LABEL: ${{ github.event.inputs.label }}
        run: |
          python3 - <<'PY'
          import base64, gzip, io, os, pathlib, re, tarfile
          job = pathlib.Path("job")
          job.mkdir()
          index = int(os.environ["INDEX"])
          seed = int(os.environ["SEED_BASE"]) + index
          if not 0 < seed < 2**31:
              raise SystemExit("worker seed must be a positive 32-bit integer")
          safe_name = r"[A-Za-z0-9_][A-Za-z0-9_.-]*"
          if os.environ["MODE"] == "bundle":
              with tarfile.open(fileobj=io.BytesIO(base64.b64decode(os.environ["BUNDLE"].strip(), validate=True)),
                                mode="r:gz") as tar:
                  members = tar.getmembers()
                  if any(not m.isfile() or m.name.endswith(".root") or not re.fullmatch(safe_name, m.name) for m in members):
                      raise SystemExit("bundle members must be plain input files with simple names; .root output is not allowed")
                  if len({m.name for m in members}) != len(members):
                      raise SystemExit("duplicate bundle member")
                  for member in members:
                      (job / member.name).write_bytes(tar.extractfile(member).read())
              member = os.environ["MEMBER"]
              if not re.fullmatch(safe_name, member) or not member.endswith(".mac"):
                  raise SystemExit("invalid macro member")
              text = (job / member).read_text()
              name = member[:-4]
          else:
              name = f"{os.environ['LABEL']}_w{index:02d}"
              text = gzip.decompress(base64.b64decode(os.environ["MACRO"].strip(), validate=True)).decode()
          if not re.fullmatch(safe_name, name):
              raise SystemExit("output label must contain only letters, digits, underscores, dots or hyphens")
          commands = [line.split("#", 1)[0].strip() for line in text.splitlines()]
          # A missing placeholder used to leave the same seed in every worker.
          # Require the actual commands, not just a placeholder in a comment.
          for command, placeholder in [("/remoll/seed", "@@SEED@@"),
                                       ("/remoll/filename", "@@OUTPUT@@")]:
              matches = [line.split() for line in commands if line.split()[:1] == [command]]
              if matches != [[command, placeholder]]:
                  raise SystemExit(f"macro needs exactly one {command} {placeholder}")
          runs = [line.split() for line in commands if line.split()[:1] == ["/run/beamOn"]]
          if len(runs) != 1 or len(runs[0]) != 2 or not re.fullmatch(r"[1-9][0-9]*", runs[0][1]):
              raise SystemExit("macro needs one /run/beamOn with a positive event count")
          run_index = next(i for i, line in enumerate(commands) if line.split()[:1] == ["/run/beamOn"])
          for command in ("/remoll/seed", "/remoll/filename"):
              if next(i for i, line in enumerate(commands) if line.split()[:1] == [command]) > run_index:
                  raise SystemExit(f"{command} must precede /run/beamOn")
          # Legacy gate images also omit rejected candidates from the tree.
          filters = {}
          for line in commands[:run_index]:
              fields = line.split()
              if len(fields) == 2 and fields[0] in ("/remoll/evgen/transportNeymanEnable",
                                                  "/remoll/evgen/transportGateEnable"):
                  filters[fields[0]] = fields[1].upper() in ("Y", "YES", "1", "T", "TRUE")
          filtered = any(filters.values())
          for det in (32, 33, 34, 35):
              if ["/remoll/SD/enable", str(det)] not in [line.split() for line in commands]:
                  raise SystemExit(f"GEM plane {det} not enabled in this macro")
          text = text.replace("@@SEED@@", str(seed)).replace("@@OUTPUT@@", f"/work/job/{name}.root")
          if "@@SEED@@" in text or "@@OUTPUT@@" in text:
              raise SystemExit("unresolved macro placeholders")
          (job / "run.mac").write_text(text)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"seed={seed}\nname={name}\nevents={runs[0][1]}\nfiltered={int(filtered)}\n")
          print(f"Job {index}: seed {seed}, output {name}.root")
          PY

      - name: Fetch identical replay input when requested
        if: inputs.replay_bank != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BANK: ${{ inputs.replay_bank }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, re, subprocess
          match = re.fullmatch(r'([A-Za-z0-9_.-]+)/([A-Za-z0-9_.-]+\.root)#([a-f0-9]{64})', os.environ['BANK'])
          if not match:
              raise SystemExit('invalid replay_bank: expected release-tag/name.root#sha256')
          tag, name, expected = match.groups()
          subprocess.run(['gh', 'release', 'download', tag, '--repo', os.environ['REPO'],
                          '--pattern', name, '--dir', 'replay-input'], check=True)
          path = pathlib.Path('replay-input') / name
          with path.open('rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          if actual != expected:
              raise SystemExit('replay bank SHA256 MISMATCH')
          path.rename(pathlib.Path('job') / 'replay-bank.root')
          pathlib.Path('job/replay-bank.sha256').write_text(actual + '\n')
          print('Verified replay-bank.root SHA256', actual)
          PY

      - name: Run remoll
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          THREADS: ${{ inputs.threads }}
          JOB_NAME: ${{ steps.macro.outputs.name }}
        run: |
          [[ "$THREADS" =~ ^[1-9][0-9]*$ ]] || { echo "threads must be a positive integer"; exit 1; }
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format '{{json .}}' > job/image-inspect.json
          # A bundled or leftover file must never count as this run's output.
          rm -f -- "job/${JOB_NAME}.root"
          set -o pipefail
          docker run --rm -v "${GITHUB_WORKSPACE}/job:/work/job" "$IMAGE" \
            remoll -t "$THREADS" -m /work/job/run.mac 2>&1 | tee job/remoll.log
          # remoll can return zero even when Geant4 rejects a macro command.
          if grep -Ei 'COMMAND NOT FOUND|COMMAND REFUSED|Batch is interrupted' job/remoll.log; then
            echo "Geant4 did not finish the requested macro"; exit 1
          fi

      - name: Validate the saved ROOT output
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          JOB_NAME: ${{ steps.macro.outputs.name }}
          EXPECTED_SEED: ${{ steps.macro.outputs.seed }}
          EXPECTED_EVENTS: ${{ steps.macro.outputs.events }}
          EXPECTED_FILTERED: ${{ steps.macro.outputs.filtered }}
        run: |
          root="job/${JOB_NAME}.root"
          if [ ! -s "$root" ]; then
            echo "remoll produced no usable ROOT output"; exit 1
          fi
          cp .github/scripts/validate_output.C job/validate_output.C
          # Use this image's ROOT dictionary, including for older image tags.
          docker run --rm -v "${GITHUB_WORKSPACE}/job:/work/job" \
            -e ROOT_INCLUDE_PATH=/jlab/remoll/include \
            -e "EXPECTED_ROOT=/work/job/${JOB_NAME}.root" \
            -e EXPECTED_SEED -e EXPECTED_EVENTS -e EXPECTED_FILTERED \
            "$IMAGE" reroot -l -b -q /work/job/validate_output.C+
          size=$(du -h "$root" | cut -f1)
          {
            echo "### ${JOB_NAME}"
            echo ""
            echo "- seed: \`${EXPECTED_SEED}\`"
            echo "- output: \`${JOB_NAME}.root\` (${size})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the ROOT file
        uses: actions/upload-artifact@v4
        with:
          name: root-${{ steps.macro.outputs.name }}
          path: |
            job/${{ steps.macro.outputs.name }}.root
            job/run.mac
            job/*.neyman.tsv
            job/*.gate.tsv
            job/image-inspect.json
            job/remoll.log
            job/replay-bank.sha256
          # ROOT files are already compressed; recompressing wastes minutes.
          compression-level: 0
          if-no-files-found: error
          # Local collection deletes successful transfers immediately.  One
          # day is only an interruption/recovery window.
          retention-days: 1
