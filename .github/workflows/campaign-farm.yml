name: Campaign farm
run-name: Beam ROOT preservation pilot · 2 × 10000
on:
  workflow_dispatch:
    inputs:
      bundle:
        description: 'Immutable same-repository release bundle: tag/name.tar.gz#sha256'
        required: true
permissions:
  contents: read
  packages: read
concurrency:
  group: beam-root-preservation-pilot
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      image: ${{ steps.plan.outputs.image }}
    steps:
      - name: Fetch and verify frozen sampler
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ inputs.bundle }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, re, subprocess, tarfile
          m=re.fullmatch(r'([A-Za-z0-9_.-]+)/([A-Za-z0-9_.-]+\.tar\.gz)#([a-f0-9]{64})',os.environ['BUNDLE'])
          if not m:raise SystemExit('Invalid frozen bundle reference')
          tag,name,digest=m.groups()
          subprocess.run(['gh','release','download',tag,'--repo',os.environ['REPO'],'--pattern',name,'--dir','input'],check=True)
          p=pathlib.Path('input')/name
          if hashlib.sha256(p.read_bytes()).hexdigest()!=digest:raise SystemExit('Bundle SHA256 mismatch')
          with tarfile.open(p,'r:gz') as t:t.extractall('bundle',filter='data')
          PY
      - name: Log in to existing simulation image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build sampler and verify regular ROOT output
        id: plan
        run: |
          set -euo pipefail
          image='ghcr.io/gahljust/remoll/remoll-campaign:cba2ad82b057076e8fb9b5a9b193238f7960daf8'
          docker pull "$image"
          docker image inspect "$image" > bundle/image-inspect.json
          pinned=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          revision=$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          test "$revision" = cba2ad82b057076e8fb9b5a9b193238f7960daf8
          docker run --rm -v "$PWD/bundle:/work/bundle" -v "$PWD:/work/results" --entrypoint /bin/bash "$pinned" -c '
            source /opt/geant4/bin/geant4.sh
            source /opt/root/bin/thisroot.sh
            source /jlab/remoll/bin/remoll.sh
            set -euo pipefail
            test "$(geant4-config --version)" = 11.4.2
            cmake -S /work/bundle -B /tmp/sampler-build -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/sampler-build -j2
            python3 -B /work/bundle/root_worker.py --bundle /work/bundle --binary /work/bundle/bin --root /jlab/remoll --out /work/results/preflight --events 2500 --seed 2050019999 --mode control
          '
          echo "image=$pinned" >> "$GITHUB_OUTPUT"
          python3 -c 'import json;print("jobs="+json.dumps(list(range(2))))' >> "$GITHUB_OUTPUT"
          tar -czf sampler-runtime.tar.gz bundle
      - name: Retain runtime and validation
        uses: actions/upload-artifact@v4
        with:
          name: beam-root-runtime
          path: |
            sampler-runtime.tar.gz
            preflight/
          retention-days: 1
          compression-level: 0
      - name: Preserve failed preflight evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: beam-root-preflight-failure
          path: preflight/
          retention-days: 1
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        job: ${{ fromJson(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: beam-root-runtime
          path: runtime
      - name: Unpack sampler
        run: tar -xzf runtime/sampler-runtime.tar.gz
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Simulate 10000 histories and verify their ROOT records
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          INDEX: ${{ matrix.job }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --rm -v "$PWD/bundle:/work/bundle:ro" -v "$PWD:/work/results" -e FARM_INDEX="$INDEX" --entrypoint /bin/bash "$IMAGE" -c '
            source /opt/geant4/bin/geant4.sh
            source /opt/root/bin/thisroot.sh
            source /jlab/remoll/bin/remoll.sh
            set -euo pipefail
            exec python3 -B /work/bundle/root_worker.py --bundle /work/bundle --binary /work/bundle/bin --root /jlab/remoll --out /work/results/output --events 10000 --seed "$((2050010000 + FARM_INDEX*100))" --mode weighted
          '
      - name: Upload complete ROOT files and audit receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beam-root-worker-${{ matrix.job }}
          path: output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
