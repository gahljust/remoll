name: Campaign farm
run-name: Beam ROOT · final 20M · original frozen wave 6
on:
  workflow_dispatch:
    inputs:
      bundle:
        description: 'Frozen original campaign bundle identity'
        required: true
permissions:
  actions: read
  contents: read
  packages: read
concurrency:
  group: beam-sampling-fixed-round
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      image: ${{ steps.plan.outputs.image }}
    steps:
      - name: Fetch original validated runtime
        uses: actions/download-artifact@v4
        with:
          name: beam-sampler-runtime
          path: runtime
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36619550929
      - name: Verify frozen runtime and seed plan
        id: plan
        env:
          BUNDLE: ${{ inputs.bundle }}
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,tarfile
          p=pathlib.Path('runtime/sampler-runtime.tar.gz')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='5f031a0c12219bc36070c187a33a108aa6024190c30965a235e79f8587e46de0'
          assert os.environ['BUNDLE']=='beam_root_120m_20260929/sampler.tar.gz#523531206ebff69daf9062f1c49eebd7ae3785a9226b2ad1c15e7d0b73078b16'
          with tarfile.open(p) as t:t.extractall('.',filter='data')
          b=pathlib.Path('bundle');f=json.loads((b/'preflight.json').read_text())
          assert f['status']=='passed' and f['inputs_sha256']=='f2388e449d4313948e2c14aaf8e4d33fe868d024d779ac87e865f212bd3bfa80'
          assert hashlib.sha256((b/'inputs.json').read_bytes()).hexdigest()==f['inputs_sha256']
          assert hashlib.sha256((b/'bin/dump_sampling').read_bytes()).hexdigest()==f['binary_sha256']
          m=json.loads((b/'inputs.json').read_text());s=m['rounds'][5]
          assert s=={'round':6,'workers':40,'events_per_worker':500000,'seed_base':2060500000}
          image=json.loads((b/'image-inspect.json').read_text())[0]['RepoDigests'][0]
          assert image=='ghcr.io/gahljust/remoll/remoll-campaign@sha256:9c131f608dc5d904eb86f1eb41c3189f2836f1e232645cf45682b538ebf6fa64'
          with open(os.environ['GITHUB_OUTPUT'],'a') as o:
              o.write('jobs='+json.dumps(list(range(40)))+'\nimage='+image+'\n')
          PYCODE
      - name: Retain identical runtime for final workers
        uses: actions/upload-artifact@v4
        with:
          name: beam-sampler-runtime
          path: runtime/sampler-runtime.tar.gz
          retention-days: 1
          compression-level: 0
  round6:
    needs: [plan]
    name: Round 6 · worker ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        job: ${{ fromJson(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: beam-sampler-runtime
          path: runtime
      - name: Unpack sampler
        run: tar -xzf runtime/sampler-runtime.tar.gz
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Simulate fixed beam sample
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          INDEX: ${{ matrix.job }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --rm -v "$PWD/bundle:/work/bundle:ro" -v "$PWD:/work/results" -e FARM_INDEX="$INDEX" --entrypoint /bin/bash "$IMAGE" -c '
            source /opt/geant4/bin/geant4.sh
            export ROOTSYS=/opt/root
            export PATH=/opt/root/bin:$PATH
            export LD_LIBRARY_PATH=/opt/root/lib:${LD_LIBRARY_PATH:-}
            source /jlab/remoll/bin/remoll.sh
            exec python3 -B /work/bundle/root_production.py worker /work/results/output --worker "$FARM_INDEX" --round 6
          '
      - name: Upload normal ROOT files and weighted audit records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beam-r6-worker-${{ matrix.job }}
          path: output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload round-check receipt
        uses: actions/upload-artifact@v4
        with:
          name: beam-receipt-r6-${{ matrix.job }}
          path: output/receipt.json
          if-no-files-found: error
          retention-days: 1
  check6:
    needs: round6
    name: Check round 6
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: beam-sampler-runtime
          path: runtime
      - run: tar -xzf runtime/sampler-runtime.tar.gz
      - uses: actions/download-artifact@v4
        with:
          pattern: beam-receipt-r6-*
          path: receipts
      - name: Verify all 40 workers and response moments
        run: python3 -B bundle/farm_round_check.py bundle receipts 6 checkpoint-r6.json
      - uses: actions/upload-artifact@v4
        with:
          name: beam-checkpoint-r6
          path: checkpoint-r6.json
          retention-days: 1
