# Frequently changed campaign controls.
title = "MOLLER detector-plane campaign"
expected_configurations = 39
output_directory = "_local_additions_archive/background_campaign/runs/default"
base_macro = "_local_additions_archive/background_campaign/base.mac"
batch_events = 10000
threads = 2
max_batches_per_configuration = 1000
max_events_per_configuration = 10000000
max_disk_gb = 500
status_update_seconds = 15
run_on_battery = false

[precision]
relative_target = 0.02
confidence = 0.95
minimum_ordinary_batches = 5
minimum_total_batches = 10
maximum_single_event_fraction = 0.01
negligible_fraction = 0.001
minimum_signal_events_for_bound = 30
stability_sigma = 3.0

[reliability]
minimum_ordinary_batches = 10
minimum_nonzero_histories = 201
maximum_variance_of_variance = 0.10
rse_slope_minimum = -0.75
rse_slope_maximum = -0.25
vov_slope_minimum = -1.50
vov_slope_maximum = -0.50
maximum_fom_relative_range = 0.30
minimum_tail_index = 3.0
maximum_next_history_fraction = 0.02

[adaptive]
enabled = true
physical_fraction = 0.20
ordinary_control_interval = 5
minimum_trials_before_reject = 3
# Reject a proposal when its variance cost is at least this many times the
# ordinary-sampling cost for the observable it was intended to improve.
rejection_cost_ratio = 1.25
# A biased batch targets one axis at a time and always retains this physical
# component, so every batch has support over the complete phase space.
axes = ["theta", "phi", "beamp", "vertexz", "outgoinge"]

[target.lh2]
macro = "macros/target/LH2.mac"
z_min_mm = -5125.0
z_max_mm = -3875.0

[target.us]
macro = "macros/target/Optics1.mac"
z_min_mm = -5124.627
z_max_mm = -5124.373

[target.ds]
macro = "macros/target/Optics2.mac"
z_min_mm = -3875.627
z_max_mm = -3875.373

[target.ms]
macro = "macros/target/Optics3.mac"
z_min_mm = -4500.000
z_max_mm = -4499.746

[sieve.none]
macro = ""

[sieve.in]
macro = "macros/sieve/sieve_in.mac"

[sieve.out]
macro = "macros/sieve/sieve_out.mac"

[interaction.moller]
generator = "moller"
adaptive_axes = ["theta", "phi", "beamp", "vertexz"]
theta_command = "thcom"
theta_min_deg = 30.0
theta_max_deg = 150.0

[interaction.ep_elastic]
generator = "elastic"
adaptive_axes = ["theta", "phi", "beamp", "vertexz"]
theta_command = "theta"
theta_min_deg = 0.1
theta_max_deg = 5.0
apply_screening = true

[interaction.ep_inelastic]
generator = "inelastic"
adaptive_axes = ["theta", "phi", "beamp", "vertexz", "outgoinge"]
theta_command = "theta"
theta_min_deg = 0.1
theta_max_deg = 5.0

[interaction.c12_elastic]
generator = "elasticC12"
adaptive_axes = ["theta", "phi", "beamp", "vertexz"]
theta_command = "theta"
theta_min_deg = 0.1
theta_max_deg = 5.0

# Full-production inventory: LH2 at 11 GeV and 65 microampere.
[[configuration]]
name = "production_lh2_11gev_moller"
enabled = true
priority = 1
target = "lh2"
sieve = "none"
interaction = "moller"
energy_gev = 11.0
current_uA = 65.0

[[configuration]]
name = "production_lh2_11gev_ep_elastic"
enabled = true
priority = 2
target = "lh2"
sieve = "none"
interaction = "ep_elastic"
energy_gev = 11.0
current_uA = 65.0

[[configuration]]
name = "production_lh2_11gev_ep_inelastic"
enabled = true
priority = 3
target = "lh2"
sieve = "none"
interaction = "ep_inelastic"
energy_gev = 11.0
current_uA = 65.0

# Calibration inventory: 3 energies x 3 foil locations x 2 sieve states x
# 2 interactions = 36 configurations.
[[configuration_matrix]]
name_format = "calibration_c12_{target}_{energy_label}gev_{interaction}_sieve_{sieve}"
enabled = true
priority = 10
targets = ["us", "ms", "ds"]
sieves = ["in", "out"]
interactions = ["moller", "c12_elastic"]
energies_gev = [2.2, 6.6, 8.8]
current_uA = 1.0
