# Short end-to-end exercise of convergence and adaptive sampling.
title = "MOLLER campaign controller test"
expected_configurations = 1
output_directory = "_local_additions_archive/background_campaign/runs/controller_test"
base_macro = "_local_additions_archive/background_campaign/base.mac"
batch_events = 1000
threads = 2
max_batches_per_configuration = 20
max_events_per_configuration = 20000
max_disk_gb = 20
status_update_seconds = 5
run_on_battery = true

[precision]
relative_target = 0.10
confidence = 0.95
minimum_ordinary_batches = 3
minimum_total_batches = 6
maximum_single_event_fraction = 0.10
negligible_fraction = 0.01
minimum_signal_events_for_bound = 10
stability_sigma = 3.0

[reliability]
minimum_ordinary_batches = 6
minimum_nonzero_histories = 201
maximum_variance_of_variance = 0.10
rse_slope_minimum = -0.80
rse_slope_maximum = -0.20
vov_slope_minimum = -1.80
vov_slope_maximum = -0.20
maximum_fom_relative_range = 0.50
minimum_tail_index = 3.0
maximum_next_history_fraction = 0.10

[adaptive]
enabled = true
physical_fraction = 0.20
ordinary_control_interval = 3
minimum_trials_before_reject = 2
rejection_cost_ratio = 1.50
axes = ["theta", "phi", "beamp", "vertexz"]

[target.lh2]
macro = "macros/target/LH2.mac"
z_min_mm = -5125.0
z_max_mm = -3875.0

[sieve.none]
macro = ""

[interaction.moller]
generator = "moller"
adaptive_axes = ["theta", "phi", "beamp", "vertexz"]
theta_command = "thcom"
theta_min_deg = 30.0
theta_max_deg = 150.0

[[configuration]]
name = "test_lh2_11gev_moller"
enabled = true
priority = 1
target = "lh2"
sieve = "none"
interaction = "moller"
energy_gev = 11.0
current_uA = 65.0
